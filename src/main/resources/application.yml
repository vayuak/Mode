server:
  port: 8080

spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            exposedHeaders:
              - Authorization
              - X-Gateway-Secret
              - X-Ghost-Shield-Key
              - Content-Length
              - Content-Type
      routes:
        # ========================================================
        # 👤 USER CATALOG AUTHORIZATION EDGE GATE
        # ========================================================
        - id: user-catalog-route
          uri: ${USER_CATALOG_URL}
          predicates:
            - Path=/v1/auth/**
          filters:
            - StripPrefix=2
            - PrefixPath=/api/users
            - SetRequestHeader=X-Ghost-Shield-Key, ${GHOST_SHIELD_KEY}
            - SetRequestHeader=X-Gateway-Secret, ${GATEWAY_SECRET}

        # ========================================================
        # 📁 ENCRYPTED MULTI-MEDIA SECURE VAULT (FIXED ROUTE)
        # ========================================================
        - id: media-vault-route
          uri: ${BLOB_URL}
          predicates:
            - Path=/v1/vault/**
          filters:
            - RewritePath=/v1/vault/(?<segment>.*), /api/vault/${segment}
            - SetRequestHeader=X-Ghost-Shield-Key, ${GHOST_SHIELD_KEY}
            - SetRequestHeader=X-Gateway-Secret, ${GATEWAY_SECRET}

        # ========================================================
        # 🛡️ P2P STOMP WEBSOCKET CRYPTO STREAM BROKER
        # ========================================================
        - id: social-websocket-route
          uri: ${P2P_URL}
          predicates:
            - Path=/v1/ws/**
          filters:
            - StripPrefix=2
            - SetRequestHeader=X-Ghost-Shield-Key, ${GHOST_SHIELD_KEY}
            - SetRequestHeader=X-Gateway-Secret, ${GATEWAY_SECRET}

        # ========================================================
        # 🔗 P2P HTTP REST BROKER (SYNC & PROFILES)
        # ========================================================
        - id: p2p-http-route
          uri: ${P2P_HTTP_URL}
          predicates:
            - Path=/v1/p2p/**
          filters:
            - JwtAuthenticationFilter
            - SetRequestHeader=X-Ghost-Shield-Key, ${GHOST_SHIELD_KEY}
            - SetRequestHeader=X-Gateway-Secret, ${GATEWAY_SECRET}

        # ========================================================
        # 📦 STANDARD REST AREA RADAR SERVICES
        # ========================================================
        - id: social-service-route
          uri: ${SOCIAL_SERVICE_URL}
          predicates:
            - Path=/v1/social/**
          filters:
            - JwtAuthenticationFilter
            - RewritePath=/v1/social/(?<segment>.*), /api/social/${segment}
            - SetRequestHeader=X-Ghost-Shield-Key, ${GHOST_SHIELD_KEY}
            - SetRequestHeader=X-Gateway-Secret, ${GATEWAY_SECRET}

        # ========================================================
        # 📡 AIRDROP NEARBY CAMPFIRE RADAR MICROSERVICE
        # ========================================================
        - id: campfire-radar-route
          uri: ${CAMPFIRE_SERVICE_URL}
          predicates:
            - Path=/v1/campfire/**
          filters:
            - JwtAuthenticationFilter
            - SetRequestHeader=X-Ghost-Shield-Key, ${GHOST_SHIELD_KEY}
            - SetRequestHeader=X-Gateway-Secret, ${GATEWAY_SECRET}

# ========================================================
# 🚫 SERVICE REGISTRY DISABLED
# ========================================================
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG

ghost:
  shield:
    jwt-secret: ${JWT_SECRET}