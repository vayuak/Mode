server:
  port: ${PORT}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain
    min-response-size: 1024

spring:
  application:
    name: API-GATEWAY

  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}
      password: ${SPRING_REDIS_PASSWORD}
      timeout: 3000ms

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            exposedHeaders:
              - Authorization
              - X-Gateway-Secret
              - X-Ghost-Shield-Key
              - Content-Length
              - Content-Type
      routes:
        - id: user-catalog-route
          uri: ${USER_CATALOG_URL}
          predicates:
            - Path=/v1/auth/**
          filters:
            - StripPrefix=2
            - PrefixPath=/api/users
            - SetRequestHeader=X-Ghost-Shield-Key, ${GHOST_SHIELD_KEY}
            - SetRequestHeader=X-Gateway-Secret, ${GATEWAY_SECRET}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 5
                key-resolver: "#{@ipKeyResolver}"

        - id: campfire-radar-route
          uri: ${CAMPFIRE_SERVICE_URL}
          predicates:
            - Path=/v1/campfire/**
          filters:
            - JwtAuthenticationFilter
            - SetRequestHeader=X-Ghost-Shield-Key, ${GHOST_SHIELD_KEY}
            - SetRequestHeader=X-Gateway-Secret, ${GATEWAY_SECRET}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@ipKeyResolver}"

        - id: media-vault-route
          uri: ${BLOB_URL}
          predicates:
            - Path=/v1/vault/**
          filters:
            - RewritePath=/v1/vault/(?<segment>.*), /api/vault/${segment}
            - SetRequestHeader=X-Ghost-Shield-Key, ${GHOST_SHIELD_KEY}
            - SetRequestHeader=X-Gateway-Secret, ${GATEWAY_SECRET}

        - id: social-websocket-route
          uri: ${P2P_URL}
          predicates:
            - Path=/v1/ws/**
          filters:
            - StripPrefix=2
            - SetRequestHeader=X-Ghost-Shield-Key, ${GHOST_SHIELD_KEY}
            - SetRequestHeader=X-Gateway-Secret, ${GATEWAY_SECRET}

        - id: p2p-http-route
          uri: ${P2P_HTTP_URL}
          predicates:
            - Path=/v1/p2p/**
          filters:
            - JwtAuthenticationFilter
            - SetRequestHeader=X-Ghost-Shield-Key, ${GHOST_SHIELD_KEY}
            - SetRequestHeader=X-Gateway-Secret, ${GATEWAY_SECRET}

        - id: social-service-route
          uri: ${SOCIAL_SERVICE_URL}
          predicates:
            - Path=/v1/social/**
          filters:
            - JwtAuthenticationFilter
            - RewritePath=/v1/social/(?<segment>.*), /api/social/${segment}
            - SetRequestHeader=X-Ghost-Shield-Key, ${GHOST_SHIELD_KEY}
            - SetRequestHeader=X-Gateway-Secret, ${GATEWAY_SECRET}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.http.server.reactive: INFO

ghost:
  shield:
    jwt-secret: ${JWT_SECRET}