server:
  port: 8080

spring:
  application:
    name: API-GATEWAY
  cloud:
    loadbalancer:
      eager-load:
        clients: [USER-CATALOG-SERVICE, SOCIAL-SERVICE, BLOB, P2P-SERVICE]
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            exposedHeaders:
              - Authorization
              - X-Gateway-Secret
              - X-Ghost-Shield-Key
              - Content-Length
              - Content-Type
      routes:
        # ========================================================
        # 👤 USER CATALOG AUTHORIZATION EDGE GATE
        # ========================================================
        - id: user-catalog-route
          uri: lb://USER-CATALOG-SERVICE
          predicates:
            - Path=/v1/auth/**
          filters:
            - StripPrefix=2
            - PrefixPath=/api/users
            - SetRequestHeader=X-Ghost-Shield-Key, ${GHOST_SHIELD_KEY:PermanentSecret999}
            - SetRequestHeader=X-Gateway-Secret, ${GATEWAY_SECRET:CryptographicGhostShieldInternalTokenSignature7350_465}

        # ========================================================
        # 📁 ENCRYPTED MULTI-MEDIA SECURE VAULT (FIXED ROUTE)
        # ========================================================
        - id: media-vault-route
          uri: lb://BLOB
          predicates:
            - Path=/v1/vault/**
          filters:
            # 🟢 FIX: Cleanly rewrites /v1/vault/stream/xyz -> /api/vault/stream/xyz
            - RewritePath=/v1/vault/(?<segment>.*), /api/vault/${segment}
            - SetRequestHeader=X-Ghost-Shield-Key, ${GHOST_SHIELD_KEY:PermanentSecret999}
            - SetRequestHeader=X-Gateway-Secret, ${GATEWAY_SECRET:CryptographicGhostShieldInternalTokenSignature7350_465}

        # ========================================================
        # 🛡️ P2P STOMP WEBSOCKET CRYPTO STREAM BROKER
        # ========================================================
        - id: social-websocket-route
          uri: lb:ws://P2P-SERVICE
          predicates:
            - Path=/v1/ws/**
          filters:
            - StripPrefix=2
            - SetRequestHeader=X-Ghost-Shield-Key, ${GHOST_SHIELD_KEY:PermanentSecret999}
            - SetRequestHeader=X-Gateway-Secret, ${GATEWAY_SECRET:CryptographicGhostShieldInternalTokenSignature7350_465}

        # ========================================================
        # 📦 STANDARD REST AREA RADAR SERVICES
        # ========================================================
        - id: social-service-route
          uri: lb://SOCIAL-SERVICE
          predicates:
            - Path=/v1/social/**
          filters:
            - JwtAuthenticationFilter
            - RewritePath=/v1/social/(?<segment>.*), /api/social/${segment}
            - SetRequestHeader=X-Ghost-Shield-Key, ${GHOST_SHIELD_KEY:PermanentSecret999}
            - SetRequestHeader=X-Gateway-Secret, ${GATEWAY_SECRET:CryptographicGhostShieldInternalTokenSignature7350_465}

eureka:
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG

ghost:
  shield:
    jwt-secret: ${JWT_SECRET:SuperSecurePermanentSecretKeyThatIsAtLeast64BytesLongForSecurityGuarantees}